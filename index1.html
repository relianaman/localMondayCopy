<html>
    <head>
        <title>1st Page</title>
        <link rel="stylesheet" href="style1.css">
    </head>
    <body>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact Us</a></li>
        </ul>

        <p>Arithmetic Operations</p>
        
        <table>
            <thead>
                <tr>
                    <td>S No.</td>
                    <td>First Number</td>
                    <td>Operation</td>
                    <td>Second Number</td>
                    <td>Output</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td id="first1"></td>
                    <td>+</td>
                    <td id="second1"></td>
                    <td id="sum"></td>
                </tr>

                <tr>
                    <td>2</td>
                    <td id="first2"></td>
                    <td>-</td>
                    <td id="second2"></td>
                    <td id="difference"></td>
                </tr>

                <tr>
                    <td>3</td>
                    <td id="first3"></td>
                    <td>*</td>
                    <td id="second3"></td>
                    <td id="multiply"></td>
                </tr>

                <tr>
                    <td>4</td>
                    <td id="first4"></td>
                    <td>/</td>
                    <td id="second4"></td>
                    <td id="divide"></td>
                </tr>
        </table>

        <script>
            let a = parseInt(prompt("Enter a number A: "));
            let b = parseInt(prompt("Enter a number B: "));

            document.getElementById("first1").textContent = a;
            document.getElementById("second1").textContent = b;
            document.getElementById("sum").textContent = "The sum is: " + (a + b);

            document.getElementById("first2").textContent = a;
            document.getElementById("second2").textContent = b;
            document.getElementById("difference").textContent = "The difference is: " + (a - b);

            document.getElementById("first3").textContent = a;
            document.getElementById("second3").textContent = b;
            document.getElementById("multiply").textContent = "The multiply is: " + (a * b);

            document.getElementById("first4").textContent = a;
            document.getElementById("second4").textContent = b;
            document.getElementById("divide").textContent = "The divide is: " + (a / b);
        </script>
    </body>
</html>
