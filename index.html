    <body>

        <script>
            let a = parseInt(prompt("Enter a number A: "));
            let b = parseInt(prompt("Enter a number B: "));

            // let c = a + b;
            // document.write("The sum is: " + c);

            document.getElementById("first").textContent = a;
            document.getElementById("second").textContent = b;
            document.getElementById("output").textContent = "The sum is: " + (a + b);
        </script>
        
        <table>
            <thead>
                <tr>
                    <td>S No.</td>
                    <td>First Number</td>
                    <td>Operation</td>
                    <td>Second Number</td>
                    <td>Output</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td id="first"></td>
                    <td>+</td>
                    <td id="second"></td>
                    <td id="output"></td>
                </tr>
        </table>
    </body>
</html>
