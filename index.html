
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <div>
                <h1>Student Task Manager</h1>
                <p>Organize your studies. Stay on track.</p>
            </div>
            <span class="header-icon">📚</span>
        </div>
    </header>

    <main class="container">

        <!-- Dashboard Statistics -->
        <section class="stats">
            <div class="stat-card">
                <span class="stat-icon">📋</span>
                <div>
                    <p>Total Tasks</p>
                    <h2 id="totalTasks">0</h2>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon">⏳</span>
                <div>
                    <p>Pending Tasks</p>
                    <h2 id="pendingTasks">0</h2>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon">✅</span>
                <div>
                    <p>Completed Tasks</p>
                    <h2 id="completedTasks">0</h2>
                </div>
            </div>
        </section>

        <!-- Add / Edit Task Form -->
        <section class="panel">
            <h2 id="formHeading">Add a New Task</h2>

            <form id="taskForm">
                <div class="form-group">
                    <label for="title">Task Title *</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Complete Java assignment"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="Enter task details..."
                        rows="3"
                        maxlength="1000"
                    ></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dueDate">Due Date *</label>
                        <input type="date" id="dueDate" required>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority *</label>
                        <select id="priority" required>
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitButton" class="btn btn-primary">
                        + Add Task
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="btn btn-secondary"
                        hidden
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <!-- Task Filters -->
        <section class="panel">
            <div class="task-heading">
                <h2>My Tasks</h2>
                <span id="taskCount" class="task-count">0 tasks</span>
            </div>

            <div class="filters">
                <div class="form-group">
                    <label for="statusFilter">Filter by Status</label>
                    <select id="statusFilter">
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priorityFilter">Filter by Priority</label>
                    <select id="priorityFilter">
                        <option value="all">All Priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
            </div>

            <div id="taskList" class="task-list"></div>
        </section>

        <footer>
            <p>Student Task Manager &copy; 2026</p>
        </footer>

    </main>

</body>
</html>
